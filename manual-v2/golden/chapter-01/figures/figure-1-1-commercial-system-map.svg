<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Figura 1.1 — Il sistema commerciale collega mercato, acquisizione, vendita, esperienza, economia e capacità</title>
  <desc id="desc">Mappa in due righe del sistema commerciale. La catena principale parte da mercato e cliente, passa per problema e alternative, ragione di scelta, offerta, prova e fiducia, domanda e acquisizione, vendita, esperienza, continuità e passaparola, economia e cassa, capacità e organizzazione. Frecce di ritorno mostrano che vendita ed esperienza producono informazioni a monte e che economia e capacità limitano l'intensità di acquisizione.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#111"/></marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#555"/></marker>
  </defs>
  <rect x="20" y="20" width="1160" height="720" rx="18" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="60" y="68" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#111">Il sistema commerciale</text>
  <text x="60" y="103" font-family="Arial, sans-serif" font-size="17" fill="#333">Una vittoria locale conta solo se migliora il risultato dell'intero sistema.</text>
  <g font-family="Arial, sans-serif" font-size="17" text-anchor="middle" fill="#111">
    <g><rect x="55" y="155" width="155" height="78" rx="12" fill="#f3f3f3" stroke="#222"/><text x="132" y="185"><tspan x="132">Mercato</tspan><tspan x="132" dy="23">e cliente</tspan></text></g>
    <g><rect x="235" y="155" width="155" height="78" rx="12" fill="#f3f3f3" stroke="#222"/><text x="312" y="185"><tspan x="312">Problema</tspan><tspan x="312" dy="23">e alternative</tspan></text></g>
    <g><rect x="415" y="155" width="155" height="78" rx="12" fill="#f3f3f3" stroke="#222"/><text x="492" y="185"><tspan x="492">Ragione</tspan><tspan x="492" dy="23">di scelta</tspan></text></g>
    <g><rect x="595" y="155" width="155" height="78" rx="12" fill="#f3f3f3" stroke="#222"/><text x="672" y="197">Offerta</text></g>
    <g><rect x="775" y="155" width="155" height="78" rx="12" fill="#f3f3f3" stroke="#222"/><text x="852" y="185"><tspan x="852">Prova</tspan><tspan x="852" dy="23">e fiducia</tspan></text></g>
    <g><rect x="955" y="155" width="185" height="78" rx="12" fill="#e9e9e9" stroke="#111" stroke-width="1.6"/><text x="1047" y="185"><tspan x="1047">Domanda</tspan><tspan x="1047" dy="23">e acquisizione</tspan></text></g>
  </g>
  <g stroke="#111" stroke-width="2.3" fill="none" marker-end="url(#arrow)"><line x1="210" y1="194" x2="232" y2="194"/><line x1="390" y1="194" x2="412" y2="194"/><line x1="570" y1="194" x2="592" y2="194"/><line x1="750" y1="194" x2="772" y2="194"/><line x1="930" y1="194" x2="952" y2="194"/></g>
  <path d="M1047 233 L1047 286 L145 286 L145 333" fill="none" stroke="#111" stroke-width="2.3" marker-end="url(#arrow)"/>
  <g font-family="Arial, sans-serif" font-size="17" text-anchor="middle" fill="#111">
    <g><rect x="55" y="335" width="180" height="82" rx="12" fill="#f3f3f3" stroke="#222"/><text x="145" y="383">Vendita</text></g>
    <g><rect x="260" y="335" width="180" height="82" rx="12" fill="#f3f3f3" stroke="#222"/><text x="350" y="365"><tspan x="350">Esperienza</tspan><tspan x="350" dy="23">reale</tspan></text></g>
    <g><rect x="465" y="335" width="190" height="82" rx="12" fill="#f3f3f3" stroke="#222"/><text x="560" y="365"><tspan x="560">Continuità</tspan><tspan x="560" dy="23">e passaparola</tspan></text></g>
    <g><rect x="680" y="335" width="190" height="82" rx="12" fill="#f3f3f3" stroke="#222"/><text x="775" y="365"><tspan x="775">Economia</tspan><tspan x="775" dy="23">e cassa</tspan></text></g>
    <g><rect x="895" y="335" width="245" height="82" rx="12" fill="#e9e9e9" stroke="#111" stroke-width="1.6"/><text x="1017" y="365"><tspan x="1017">Capacità</tspan><tspan x="1017" dy="23">e organizzazione</tspan></text></g>
  </g>
  <g stroke="#111" stroke-width="2.3" fill="none" marker-end="url(#arrow)"><line x1="235" y1="376" x2="257" y2="376"/><line x1="440" y1="376" x2="462" y2="376"/><line x1="655" y1="376" x2="677" y2="376"/><line x1="870" y1="376" x2="892" y2="376"/></g>
  <path d="M145 418 C145 515, 310 525, 312 237" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="177" y="492" font-family="Arial, sans-serif" font-size="15" fill="#444">obiezioni, criteri, motivi di scelta</text>
  <path d="M350 418 C350 560, 850 575, 852 237" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="498" y="550" font-family="Arial, sans-serif" font-size="15" fill="#444">risultati, prove, recensioni, attriti</text>
  <path d="M775 418 C775 625, 1080 625, 1047 237" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="817" y="612" font-family="Arial, sans-serif" font-size="15" fill="#444">economia → quanto possiamo spingere la domanda</text>
  <path d="M1017 418 C1115 500, 1160 430, 1125 235" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="910" y="490" font-family="Arial, sans-serif" font-size="15" fill="#444">capacità → volume servibile</text>
  <text x="60" y="700" font-family="Arial, sans-serif" font-size="16" fill="#333">Le frecce tratteggiate rappresentano feedback: il sistema impara anche da ciò che accade dopo la vendita.</text>
</svg>