<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">Figura 1.2 — Causa, amplificatore e sintomo svolgono ruoli diversi</title>
  <desc id="desc">Tre blocchi mostrano una condizione a monte che genera un problema, un amplificatore che aumenta il volume dell'effetto e un sintomo visibile a valle. Una nota mostra che ridurre l'amplificatore può attenuare il sintomo senza rimuovere la causa.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#111"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="1060" height="480" rx="18" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="55" y="70" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#111">Causa, amplificatore e sintomo non sono la stessa cosa</text>

  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#111">
    <rect x="70" y="155" width="260" height="150" rx="16" fill="#f0f0f0" stroke="#222" stroke-width="1.7"/>
    <text x="200" y="195" font-size="22" font-weight="700">CAUSA</text>
    <text x="200" y="230" font-size="16"><tspan x="200">Condizione a monte che</tspan><tspan x="200" dy="22">genera il problema</tspan></text>
    <text x="200" y="282" font-size="14" fill="#444"><tspan x="200">es. capacità insufficiente,</tspan><tspan x="200" dy="19">cliente/fit sbagliato</tspan></text>

    <rect x="420" y="155" width="260" height="150" rx="16" fill="#e8e8e8" stroke="#222" stroke-width="1.7"/>
    <text x="550" y="195" font-size="22" font-weight="700">AMPLIFICATORE</text>
    <text x="550" y="230" font-size="16"><tspan x="550">Aumenta volume o velocità</tspan><tspan x="550" dy="22">di ciò che già esiste</tspan></text>
    <text x="550" y="282" font-size="14" fill="#444"><tspan x="550">es. più acquisizione,</tspan><tspan x="550" dy="19">più traffico, più volume</tspan></text>

    <rect x="770" y="155" width="260" height="150" rx="16" fill="#f0f0f0" stroke="#222" stroke-width="1.7"/>
    <text x="900" y="195" font-size="22" font-weight="700">SINTOMO</text>
    <text x="900" y="230" font-size="16"><tspan x="900">Effetto osservabile</tspan><tspan x="900" dy="22">a valle</tspan></text>
    <text x="900" y="282" font-size="14" fill="#444"><tspan x="900">es. ritardi, rework,</tspan><tspan x="900" dy="19">margine che scende</tspan></text>
  </g>

  <line x1="330" y1="230" x2="416" y2="230" stroke="#111" stroke-width="2.8" marker-end="url(#arrow)"/>
  <line x1="680" y1="230" x2="766" y2="230" stroke="#111" stroke-width="2.8" marker-end="url(#arrow)"/>

  <path d="M550 310 C550 395, 815 405, 900 310" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="725" y="392" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#444">ridurre l'amplificatore può attenuare il sintomo</text>

  <path d="M550 405 C455 465, 255 450, 205 315" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="350" y="455" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#444">...ma la causa resta finché non viene corretta</text>
</svg>