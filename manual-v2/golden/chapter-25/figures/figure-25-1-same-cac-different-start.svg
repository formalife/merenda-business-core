<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Figura 25.1 — Due coorti con lo stesso CAC possono avere un punto di partenza economico diverso</title>
  <desc id="desc">Due coorti hanno entrambe cento clienti acquisiti e 1800 euro di CAC per cliente. La coorte A attiva novanta clienti con novemila euro di onboarding extra, la coorte B ne attiva sessantacinque con venticinquemila euro di onboarding extra. Il contributo del primo mese è quindi molto diverso.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#222"/></marker>
  </defs>
  <rect x="20" y="20" width="1160" height="680" rx="18" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="60" y="70" font-family="Arial, sans-serif" font-size="29" font-weight="700">Stesso prezzo e stesso CAC, ma economia iniziale diversa</text>
  <text x="60" y="105" font-family="Arial, sans-serif" font-size="16" fill="#444">Dati sintetici dell'esempio numerico</text>

  <g font-family="Arial, sans-serif" fill="#111">
    <rect x="70" y="145" width="1060" height="85" rx="14" fill="#f3f3f3" stroke="#aaa"/>
    <text x="110" y="178" font-size="18" font-weight="700">Condizioni commerciali comuni</text>
    <text x="110" y="207" font-size="17">100 nuovi clienti · €480/mese · costo di acquisizione: €180.000 per coorte = €1.800 per cliente</text>

    <text x="90" y="285" font-size="24" font-weight="700">Coorte A</text>
    <text x="690" y="285" font-size="24" font-weight="700">Coorte B</text>

    <rect x="75" y="315" width="470" height="250" rx="16" fill="#fafafa" stroke="#333" stroke-width="1.5"/>
    <rect x="655" y="315" width="470" height="250" rx="16" fill="#fafafa" stroke="#333" stroke-width="1.5"/>

    <text x="110" y="355" font-size="17">90 account attivi nel primo mese</text>
    <text x="110" y="390" font-size="17">90 × €360 contribuzione = €32.400</text>
    <text x="110" y="425" font-size="17">onboarding extra: − €9.000</text>
    <line x1="110" y1="445" x2="505" y2="445" stroke="#999"/>
    <text x="110" y="485" font-size="20" font-weight="700">Contribuzione mese 1: €23.400</text>
    <text x="110" y="525" font-size="15" fill="#555">Il costo di acquisizione non è ancora recuperato.</text>

    <text x="690" y="355" font-size="17">65 account attivi nel primo mese</text>
    <text x="690" y="390" font-size="17">65 × €360 contribuzione = €23.400</text>
    <text x="690" y="425" font-size="17">onboarding extra: − €25.000</text>
    <line x1="690" y1="445" x2="1085" y2="445" stroke="#999"/>
    <text x="690" y="485" font-size="20" font-weight="700">Contribuzione mese 1: − €1.600</text>
    <text x="690" y="525" font-size="15" fill="#555">Il costo di servizio iniziale cambia l'economia.</text>

    <line x1="545" y1="440" x2="650" y2="440" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="598" y="418" font-size="14" text-anchor="middle" fill="#555">stesso CAC</text>

    <rect x="155" y="590" width="890" height="78" rx="12" fill="#efefef"/>
    <text x="600" y="620" font-size="17" text-anchor="middle" font-weight="700">
      <tspan x="600">Il CAC descrive il costo dell'acquisizione.</tspan>
      <tspan x="600" dy="24">Attivazione e costo di servizio determinano quanto valore economico inizia a rientrare.</tspan>
    </text>
  </g>
</svg>