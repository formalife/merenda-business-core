<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">Figura 18.1 — La vendita consulenziale è un processo diagnostico con diramazioni</title>
  <desc id="desc">Mappa del processo di vendita consulenziale. Il percorso principale va da contesto trasferito a diagnosi, criteri e conseguenze, stakeholder, sintesi verificata, prescrizione, prova e decisione. Diramazioni portano a richiesta di nuove evidenze, coinvolgimento di stakeholder, riapertura della diagnosi e no sale quando manca il fit.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#222"/></marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#666"/></marker>
  </defs>
  <rect x="20" y="20" width="1160" height="820" rx="18" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="60" y="68" font-family="Arial, sans-serif" font-size="29" font-weight="700">Una vendita consulenziale non è una corsa lineare verso la chiusura</text>
  <text x="60" y="101" font-family="Arial, sans-serif" font-size="16" fill="#444">Si standardizzano i lavori da svolgere; domande, profondità e risultato cambiano in base alle evidenze.</text>

  <g font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#111">
    <g><rect x="60" y="165" width="190" height="78" rx="12" fill="#f4f4f4" stroke="#333"/><text x="155" y="194"><tspan x="155">Contesto</tspan><tspan x="155" dy="21">trasferito</tspan></text></g>
    <g><rect x="285" y="165" width="190" height="78" rx="12" fill="#f4f4f4" stroke="#333"/><text x="380" y="194"><tspan x="380">Diagnosi della</tspan><tspan x="380" dy="21">situazione attuale</tspan></text></g>
    <g><rect x="510" y="165" width="190" height="78" rx="12" fill="#f4f4f4" stroke="#333"/><text x="605" y="194"><tspan x="605">Criteri, motivi</tspan><tspan x="605" dy="21">e conseguenze</tspan></text></g>
    <g><rect x="735" y="165" width="190" height="78" rx="12" fill="#f4f4f4" stroke="#333"/><text x="830" y="194"><tspan x="830">Stakeholder,</tspan><tspan x="830" dy="21">timing e vincoli</tspan></text></g>
    <g><rect x="950" y="165" width="190" height="78" rx="12" fill="#e9e9e9" stroke="#222" stroke-width="1.5"/><text x="1045" y="194"><tspan x="1045">Sintesi della</tspan><tspan x="1045" dy="21">diagnosi verificata</tspan></text></g>

    <g><rect x="130" y="355" width="210" height="80" rx="12" fill="#f4f4f4" stroke="#333"/><text x="235" y="386"><tspan x="235">Prescrizione</tspan><tspan x="235" dy="21">se esiste fit</tspan></text></g>
    <g><rect x="395" y="355" width="210" height="80" rx="12" fill="#f4f4f4" stroke="#333"/><text x="500" y="386"><tspan x="500">Prova contro il</tspan><tspan x="500" dy="21">dubbio specifico</tspan></text></g>
    <g><rect x="660" y="355" width="210" height="80" rx="12" fill="#f4f4f4" stroke="#333"/><text x="765" y="386"><tspan x="765">Proposta /</tspan><tspan x="765" dy="21">passo decisionale</tspan></text></g>
    <g><rect x="925" y="355" width="210" height="80" rx="12" fill="#e9e9e9" stroke="#222" stroke-width="1.5"/><text x="1030" y="386"><tspan x="1030">Decisione o</tspan><tspan x="1030" dy="21">prossimo stato</tspan></text></g>
  </g>

  <g stroke="#222" stroke-width="2.2" fill="none" marker-end="url(#arrow)">
    <line x1="250" y1="204" x2="282" y2="204"/>
    <line x1="475" y1="204" x2="507" y2="204"/>
    <line x1="700" y1="204" x2="732" y2="204"/>
    <line x1="925" y1="204" x2="947" y2="204"/>
    <path d="M1045 243 L1045 295 L235 295 L235 352"/>
    <line x1="340" y1="395" x2="392" y2="395"/>
    <line x1="605" y1="395" x2="657" y2="395"/>
    <line x1="870" y1="395" x2="922" y2="395"/>
  </g>

  <text x="60" y="515" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#111">Diramazioni corrette del processo</text>

  <g font-family="Arial, sans-serif" fill="#111">
    <rect x="70" y="550" width="250" height="100" rx="12" fill="#fafafa" stroke="#777"/>
    <text x="195" y="580" font-size="15" text-anchor="middle" font-weight="700">Evidenza insufficiente</text>
    <text x="195" y="606" font-size="14" text-anchor="middle">richiedi dati / artefatti</text>
    <text x="195" y="629" font-size="14" text-anchor="middle">e torna alla diagnosi</text>

    <rect x="350" y="550" width="250" height="100" rx="12" fill="#fafafa" stroke="#777"/>
    <text x="475" y="580" font-size="15" text-anchor="middle" font-weight="700">Stakeholder mancante</text>
    <text x="475" y="606" font-size="14" text-anchor="middle">coinvolgi chi possiede</text>
    <text x="475" y="629" font-size="14" text-anchor="middle">processo / veto / autorità</text>

    <rect x="630" y="550" width="250" height="100" rx="12" fill="#fafafa" stroke="#777"/>
    <text x="755" y="580" font-size="15" text-anchor="middle" font-weight="700">Obiezione vaga</text>
    <text x="755" y="606" font-size="14" text-anchor="middle">identifica che cosa manca</text>
    <text x="755" y="629" font-size="14" text-anchor="middle">e riapri il punto pertinente</text>

    <rect x="910" y="550" width="220" height="100" rx="12" fill="#f1f1f1" stroke="#555" stroke-width="1.5"/>
    <text x="1020" y="580" font-size="15" text-anchor="middle" font-weight="700">Nessun fit</text>
    <text x="1020" y="606" font-size="14" text-anchor="middle">no vendita / referral</text>
    <text x="1020" y="629" font-size="14" text-anchor="middle">o stop consapevole</text>
  </g>

  <g fill="none" stroke="#666" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#arrowGray)">
    <path d="M195 550 C195 480, 380 500, 380 246"/>
    <path d="M475 550 C475 490, 830 500, 830 246"/>
    <path d="M755 550 C755 500, 1030 510, 1030 438"/>
    <path d="M910 600 C865 600, 835 515, 765 438"/>
  </g>

  <rect x="120" y="700" width="960" height="72" rx="12" fill="#efefef"/>
  <text x="600" y="730" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" font-weight="700">
    <tspan x="600">Il processo è ripetibile perché i lavori diagnostici sono stabili.</tspan>
    <tspan x="600" dy="24">Non è rigido: evidenze diverse possono produrre prescrizione, nuovo passo o nessuna vendita.</tspan>
  </text>
</svg>