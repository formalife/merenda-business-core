<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Figura 18.2 — Una decisione complessa può avere più proprietari</title>
  <desc id="desc">Mappa stakeholder di Ferroline Servizi. La decisione centrale è ottenere reporting affidabile prima del board. Laura CFO ha autorità economica e sponsorship, Marco Sales Director possiede il processo commerciale e le definizioni pipeline, Elisa IT controlla accessi e integrazioni, CEO e board usano il reporting e fissano l'aspettativa di affidabilità.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#555"/></marker>
  </defs>
  <rect x="20" y="20" width="1160" height="720" rx="18" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="60" y="70" font-family="Arial, sans-serif" font-size="29" font-weight="700">“Chi decide?” spesso è una domanda troppo semplice</text>
  <text x="60" y="104" font-family="Arial, sans-serif" font-size="16" fill="#444">Budget, processo, accesso tecnico e uso finale possono appartenere a persone diverse.</text>

  <circle cx="600" cy="380" r="135" fill="#efefef" stroke="#222" stroke-width="2"/>
  <text x="600" y="342" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="700">Decisione reale</text>
  <text x="600" y="377" font-family="Arial, sans-serif" font-size="17" text-anchor="middle">reporting abbastanza affidabile</text>
  <text x="600" y="403" font-family="Arial, sans-serif" font-size="17" text-anchor="middle">da sostenere le decisioni</text>
  <text x="600" y="429" font-family="Arial, sans-serif" font-size="17" text-anchor="middle">prima del prossimo board</text>

  <g font-family="Arial, sans-serif" fill="#111">
    <rect x="80" y="155" width="300" height="150" rx="15" fill="#fafafa" stroke="#555"/>
    <text x="110" y="192" font-size="21" font-weight="700">Laura — CFO</text>
    <text x="110" y="226" font-size="16">sponsor della conversazione</text>
    <text x="110" y="252" font-size="16">autorità economica sul progetto</text>
    <text x="110" y="278" font-size="16">bisogno: numeri difendibili per il board</text>

    <rect x="820" y="155" width="300" height="150" rx="15" fill="#fafafa" stroke="#555"/>
    <text x="850" y="192" font-size="21" font-weight="700">Marco — Sales Director</text>
    <text x="850" y="226" font-size="16">proprietario del processo vendita</text>
    <text x="850" y="252" font-size="16">influenza definizioni pipeline</text>
    <text x="850" y="278" font-size="16">serve per adozione e significato dei dati</text>

    <rect x="80" y="510" width="300" height="150" rx="15" fill="#fafafa" stroke="#555"/>
    <text x="110" y="547" font-size="21" font-weight="700">Elisa — IT Manager</text>
    <text x="110" y="581" font-size="16">controlla accessi e integrazioni</text>
    <text x="110" y="607" font-size="16">può bloccare soluzioni tecniche</text>
    <text x="110" y="633" font-size="16">non decide le regole commerciali</text>

    <rect x="820" y="510" width="300" height="150" rx="15" fill="#fafafa" stroke="#555"/>
    <text x="850" y="547" font-size="21" font-weight="700">CEO / board</text>
    <text x="850" y="581" font-size="16">usa il reporting per decidere</text>
    <text x="850" y="607" font-size="16">fissa l'aspettativa di affidabilità</text>
    <text x="850" y="633" font-size="16">non deve partecipare a ogni dettaglio</text>
  </g>

  <g stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="380" y1="270" x2="485" y2="325"/>
    <line x1="820" y1="270" x2="715" y2="325"/>
    <line x1="380" y1="560" x2="485" y2="435"/>
    <line x1="820" y1="560" x2="715" y2="435"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="14" fill="#555" text-anchor="middle">
    <text x="420" y="279">budget / sponsor</text>
    <text x="780" y="279">processo / adozione</text>
    <text x="420" y="535">accesso / veto tecnico</text>
    <text x="780" y="535">uso / governance</text>
  </g>

  <text x="600" y="706" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#333">Avere il budget approvato non basta se mancano le persone necessarie a rendere vera la prescrizione.</text>
</svg>