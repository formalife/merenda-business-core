name: semantic-state-sync-251-275

on:
  push:
    branches: [semantic-251-275]
    paths:
      - .github/workflows/semantic-state-sync-251-275.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: semantic-251-275
          fetch-depth: 0
      - name: Sync semantic state for 267-275
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          mapping = {
              'Vqn55dABlHQ': '06_vendita',
              'IGR6IPPvY3Q': '01_mercato',
              '9YoGG3UT1Yc': '06_vendita',
              '21iVqc13KoE': '06_vendita',
              'D96IKTeUfK4': '06_vendita',
              'NyH30NE16_0': '06_vendita',
              '0QpK3scgm4c': '05_acquisizione',
              'G4j1zImJq8I': '05_acquisizione',
              'jIVCaEJe9RU': '05_acquisizione',
          }

          p = Path('sources/catalog.json')
          data = json.loads(p.read_text())
          seen = set()
          for row in data:
              vid = row.get('id')
              if vid in mapping:
                  row['status'] = 'STUDIATO'
                  row['category'] = mapping[vid]
                  seen.add(vid)
          missing = set(mapping) - seen
          if missing:
              raise SystemExit(f'missing catalog ids: {sorted(missing)}')
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          for filename, cat_idx, status_idx in [
              ('sources/VIDEO_INDEX.md', 6, 8),
              ('sources/queue/QUEUE.md', 3, 4),
          ]:
              path = Path(filename)
              lines = path.read_text().splitlines()
              found = set()
              out = []
              for line in lines:
                  hit = next((vid for vid in mapping if vid in line and line.startswith('|')), None)
                  if hit:
                      parts = line.split('|')
                      if len(parts) <= max(cat_idx, status_idx):
                          raise SystemExit(f'unexpected row format in {filename}: {line}')
                      parts[cat_idx] = f' {mapping[hit]} '
                      parts[status_idx] = ' STUDIATO '
                      line = '|'.join(parts)
                      found.add(hit)
                  out.append(line)
              missing = set(mapping) - found
              if missing:
                  raise SystemExit(f'missing ids in {filename}: {sorted(missing)}')
              path.write_text('\n'.join(out) + '\n')
          PY
          git diff --check
          git diff -- sources/catalog.json sources/VIDEO_INDEX.md sources/queue/QUEUE.md
      - name: Commit synchronized state
        run: |
          git config user.name "formalife-semantic-sync"
          git config user.email "actions@users.noreply.github.com"
          git add sources/catalog.json sources/VIDEO_INDEX.md sources/queue/QUEUE.md
          git commit -m "Sync semantic state for videos 267-275"
          git push origin HEAD:semantic-251-275
