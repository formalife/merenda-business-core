name: Validate Formalife Zero

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - merenda-source-corpus-001

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate repository invariants
        run: python3 scripts/validate_project.py

      - name: Validate routing eval suite
        run: python3 scripts/validate_routing_evals.py

      - name: Validate draft retrieval map
        run: python3 scripts/validate_retrieval_map.py

      - name: Score static routing addressability
        run: python3 scripts/score_static_routing_coverage.py

      - name: Build architecture inventory
        run: >-
          python3 scripts/build_architecture_inventory.py
          --json-out /tmp/architecture-inventory.json
          --md-out /tmp/architecture-inventory.md

      - name: Upload architecture inventory
        uses: actions/upload-artifact@v4
        with:
          name: architecture-inventory
          path: |
            /tmp/architecture-inventory.json
            /tmp/architecture-inventory.md

      - name: Verify clean working tree
        run: git status --porcelain=v1
