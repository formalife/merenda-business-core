name: Build Redesigned Golden A B Preview

on:
  push:
    branches:
      - manual-v2-architecture-2026-09-20
    paths:
      - 'manual-v2/golden/part-01-intro.md'
      - 'manual-v2/golden/part-07-intro.md'
      - 'manual-v2/golden/chapter-01/**'
      - 'manual-v2/golden/chapter-25/**'
      - '.github/workflows/golden-ab-redesign-preview.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core poppler-utils
          pip install markdown weasyprint

      - name: Build redesigned founder preview
        run: |
          mkdir -p build/golden-redesign
          python - <<'PY'
          from pathlib import Path
          import re
          import markdown

          files = [
              ('part', Path('manual-v2/golden/part-01-intro.md'), None),
              ('chapter', Path('manual-v2/golden/chapter-01/DRAFT.md'), 'manual-v2/golden/chapter-01/figures'),
              ('part', Path('manual-v2/golden/part-07-intro.md'), None),
              ('chapter', Path('manual-v2/golden/chapter-25/DRAFT.md'), 'manual-v2/golden/chapter-25/figures'),
          ]

          sections = []
          total_words = 0
          for kind, path, figure_root in files:
              text = path.read_text(encoding='utf-8')
              words = re.findall(r"\b[\wÀ-ÿ’'-]+\b", text)
              total_words += len(words)
              print(f'{path}: {len(words)} words')
              if figure_root:
                  text = text.replace('(figures/', f'(../../{figure_root}/')
              body = markdown.markdown(text, extensions=['tables'])
              sections.append(f'<section class="{kind}">{body}</section>')

          print(f'Total preview words: {total_words}')

          cover = '''
          <section class="cover">
            <div class="eyebrow">Manuale V2 · Secondo prototipo per founder review</div>
            <h1>Architettura theory-first</h1>
            <p>Questo prototipo mostra la nuova gerarchia editoriale e due capitoli riscritti dopo il founder gate fallito.</p>
            <div class="cover-list">
              <p><strong>Parte I — Fondamenti del sistema</strong><br>Capitolo 1 — Il sistema di marketing</p>
              <p><strong>Parte VII — Economia e organizzazione</strong><br>Capitolo 25 — Economia del cliente</p>
            </div>
          </section>
          '''

          css = r'''
          @page {
            size: A4;
            margin: 22mm 19mm 23mm 19mm;
            @bottom-center {
              content: counter(page);
              font-family: DejaVu Sans, sans-serif;
              font-size: 8.5pt;
              color: #666;
            }
          }
          * { box-sizing: border-box; }
          body {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 10.8pt;
            line-height: 1.58;
            color: #1e1e1e;
          }
          .cover {
            min-height: 245mm;
            display: flex;
            flex-direction: column;
            justify-content: center;
            page-break-after: always;
          }
          .cover .eyebrow {
            font-family: DejaVu Sans, Arial, sans-serif;
            font-size: 9.5pt;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            color: #666;
            margin-bottom: 9mm;
          }
          .cover h1 {
            font-family: DejaVu Sans, Arial, sans-serif;
            font-size: 30pt;
            line-height: 1.1;
            margin: 0 0 8mm;
          }
          .cover > p { font-size: 13pt; line-height: 1.5; max-width: 135mm; }
          .cover-list { margin-top: 18mm; font-family: DejaVu Sans, Arial, sans-serif; font-size: 10pt; }
          section.part { page-break-before: always; page-break-after: always; padding-top: 34mm; }
          section.part h1 {
            font-family: DejaVu Sans, Arial, sans-serif;
            font-size: 28pt;
            line-height: 1.1;
            margin: 0 0 15mm;
            font-weight: 700;
          }
          section.part p { font-size: 11.7pt; line-height: 1.68; margin-bottom: 5.5mm; }
          section.chapter { page-break-before: always; }
          section.chapter h1, section.chapter h2, section.chapter h3 {
            font-family: DejaVu Sans, Arial, sans-serif;
            color: #111;
          }
          section.chapter h1 { font-size: 24pt; line-height: 1.12; margin: 0 0 17mm 0; font-weight: 700; page-break-after: avoid; }
          section.chapter h2 { font-size: 15pt; line-height: 1.22; margin: 9mm 0 3.5mm; font-weight: 700; page-break-after: avoid; }
          section.chapter h3 { font-size: 12.3pt; line-height: 1.25; margin: 7mm 0 2.5mm; font-weight: 700; page-break-after: avoid; }
          p { margin: 0 0 4.2mm; orphans: 3; widows: 3; hyphens: auto; }
          strong { font-weight: 700; }
          blockquote {
            margin: 7mm 6mm;
            padding: 4mm 5mm;
            border-left: 3px solid #333;
            background: #f4f4f4;
            font-family: DejaVu Sans, Arial, sans-serif;
            font-size: 9.5pt;
            line-height: 1.48;
            break-inside: avoid;
          }
          blockquote p { margin: 0 0 2.4mm; }
          blockquote p:last-child { margin-bottom: 0; }
          table {
            width: 100%;
            border-collapse: collapse;
            margin: 7mm 0 8mm;
            font-family: DejaVu Sans, Arial, sans-serif;
            font-size: 8.7pt;
            line-height: 1.32;
            break-inside: avoid;
          }
          th, td { border-bottom: 0.5px solid #aaa; padding: 2.4mm 2.2mm; vertical-align: top; }
          th { background: #efefef; font-weight: 700; }
          td:not(:first-child), th:not(:first-child) { text-align: right; }
          img { display: block; max-width: 100%; max-height: 188mm; margin: 8mm auto 4mm; break-inside: avoid; }
          p:has(> img) { margin-bottom: 8mm; }
          ol, ul { margin: 4mm 0 5mm 7mm; padding-left: 5mm; }
          li { margin-bottom: 1.5mm; }
          code { font-family: DejaVu Sans Mono, monospace; }
          '''

          html = f'''<!doctype html><html lang="it"><head><meta charset="utf-8"><style>{css}</style></head><body>{cover}{''.join(sections)}</body></html>'''
          Path('build/golden-redesign/preview.html').write_text(html, encoding='utf-8')
          PY

          weasyprint build/golden-redesign/preview.html build/golden-redesign/Manuale_V2_Secondo_Prototipo_AB.pdf
          pdfinfo build/golden-redesign/Manuale_V2_Secondo_Prototipo_AB.pdf | tee build/golden-redesign/pdfinfo.txt

      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: manual-v2-redesigned-golden-ab-preview
          path: |
            build/golden-redesign/Manuale_V2_Secondo_Prototipo_AB.pdf
            build/golden-redesign/pdfinfo.txt
          retention-days: 7
