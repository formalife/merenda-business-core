name: Temporary integrate Clientikit

on:
  push:
    branches: [source-clientikit]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: source-clientikit

      - name: Apply canonical merges and registry
        run: |
          python3 - <<'PY'
          import base64, json
          from pathlib import Path

          def dec(s):
              return base64.b64decode(s).decode('utf-8')

          def append_once(path_str, marker, block_b64):
              path = Path(path_str)
              text = path.read_text()
              if marker not in text:
                  if not text.endswith('\n'):
                      text += '\n'
                  text += '\n' + dec(block_b64).strip() + '\n'
                  path.write_text(text)

          append_once('merenda/01_mercato/clienti-identificabili-e-target.md', '## Progettare la campagna su più assi', '')
          append_once('merenda/04_marketing/gerarchia-domanda-e-canali.md', '## La directness segue la consapevolezza', '')
          append_once('merenda/05_acquisizione/funnel-e-conversione.md', '## Backtracking: se il messaggio è troppo avanzato', '')

          catalog_path = Path('sources/merenda-sources/catalog.json')
          rows = json.loads(catalog_path.read_text())
          ident = 'FM-SRC-0164'
          if not any(r.get('id') == ident for r in rows):
              rows.append({'id': ident, 'type': 'course', 'title': 'Clientikit', 'author_or_speaker': 'Frank Merenda', 'source_ref': 'https://my.metodomerenda.com/clientikit/', 'published_date': None, 'acquired_date': '2026-09-17', 'origin': 'official', 'status': 'STUDIATO', 'normalized_path': 'sources/merenda-sources/FM-SRC-0164/content.md', 'review_path': 'sources/merenda-sources/FM-SRC-0164/review.md', 'category': '01_mercato', 'weighted_novelty': 2, 'notes': 'Nuovo framework integrato: relazione × consapevolezza × profilo × directness → campagna → transizione; aggiunge backtracking dei non convertiti. Singoli assi in larga parte dedup con fonti 2023–2026.'})
          catalog_path.write_text(json.dumps(rows, ensure_ascii=False, indent=2) + '\n')

          status = Path('STATUS.md')
          text = status.read_text()
          text = text.replace('- Nuove fonti Merenda registrate: 163', '- Nuove fonti Merenda registrate: 164')
          text = text.replace('- Nuove fonti Merenda studiate: 163', '- Nuove fonti Merenda studiate: 164')
          old = '**CHATGPT — continuare l\'integrazione source-agnostic una fonte alla volta sui contenuti forniti dall\'utente. “Prendili per il Funnel” è registrato come FM-SRC-0163, STUDIATO e mergiato nel nodo canonico `funnel-e-conversione.md`.**'
          new = '**CHATGPT — continuare l\'integrazione source-agnostic una fonte alla volta sui contenuti forniti dall\'utente. “Clientikit” è registrato come FM-SRC-0164, STUDIATO e mergiato nei nodi canonici target, gerarchia della domanda/consapevolezza e funnel.**'
          if old not in text:
              raise SystemExit('Next Action atteso non trovato in STATUS.md')
          status.write_text(text.replace(old, new))
          PY

      - name: Validate
        run: python3 scripts/validate_project.py

      - name: Commit integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add merenda/01_mercato/clienti-identificabili-e-target.md merenda/04_marketing/gerarchia-domanda-e-canali.md merenda/05_acquisizione/funnel-e-conversione.md sources/merenda-sources/catalog.json STATUS.md
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Integrate Clientikit framework'
            git push origin HEAD:source-clientikit
          fi
