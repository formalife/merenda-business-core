name: Temporary register Prendili per il Funnel

on:
  push:
    branches: [source-prendili-per-il-funnel]

permissions:
  contents: write

jobs:
  update-registry:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: source-prendili-per-il-funnel

      - name: Append source and update status
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          catalog_path = Path('sources/merenda-sources/catalog.json')
          rows = json.loads(catalog_path.read_text())
          ident = 'FM-SRC-0163'
          if not any(r.get('id') == ident for r in rows):
              rows.append({
                  'id': ident,
                  'type': 'course',
                  'title': 'Prendili per il Funnel',
                  'author_or_speaker': 'Frank Merenda',
                  'source_ref': 'https://my.metodomerenda.com/prendili-per-il-funnel/',
                  'published_date': None,
                  'acquired_date': '2026-09-17',
                  'origin': 'official',
                  'status': 'STUDIATO',
                  'normalized_path': 'sources/merenda-sources/FM-SRC-0163/content.md',
                  'review_path': 'sources/merenda-sources/FM-SRC-0163/review.md',
                  'category': '05_acquisizione',
                  'weighted_novelty': 2,
                  'notes': 'Nuovo framework canonico: funnel come macchina a stati adattiva con routing comportamentale, accelerazione, fallback e transizioni verso vendita/post-vendita; ingredienti singoli ampiamente dedup.'
              })
          catalog_path.write_text(json.dumps(rows, ensure_ascii=False, indent=2) + '\n')

          status = Path('STATUS.md')
          text = status.read_text()
          text = text.replace('- Nuove fonti Merenda registrate: 162', '- Nuove fonti Merenda registrate: 163')
          text = text.replace('- Nuove fonti Merenda studiate: 162', '- Nuove fonti Merenda studiate: 163')
          old = '**CHATGPT — continuare l\'integrazione source-agnostic una fonte alla volta sui contenuti forniti dall\'utente. “Operazione Incassi Record” è registrato come FM-SRC-0162, STUDIATO e mergiato nei nodi canonici pertinenti.**'
          new = '**CHATGPT — continuare l\'integrazione source-agnostic una fonte alla volta sui contenuti forniti dall\'utente. “Prendili per il Funnel” è registrato come FM-SRC-0163, STUDIATO e mergiato nel nodo canonico `funnel-e-conversione.md`.**'
          if old not in text:
              raise SystemExit('Next Action atteso non trovato in STATUS.md')
          text = text.replace(old, new)
          status.write_text(text)
          PY

      - name: Validate
        run: python3 scripts/validate_project.py

      - name: Commit registry updates
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sources/merenda-sources/catalog.json STATUS.md
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Register Prendili per il Funnel source'
            git push origin HEAD:source-prendili-per-il-funnel
          fi
