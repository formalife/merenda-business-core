name: Build Golden A B Pedagogical Apparatus Preview

on:
  push:
    branches:
      - manual-v2-architecture-2026-09-20
    paths:
      - 'manual-v2/golden/part-01-intro.md'
      - 'manual-v2/golden/part-07-intro.md'
      - 'manual-v2/golden/chapter-01/DRAFT.md'
      - 'manual-v2/golden/chapter-01/APPARATUS.md'
      - 'manual-v2/golden/chapter-01/figures/**'
      - 'manual-v2/golden/chapter-25/DRAFT.md'
      - 'manual-v2/golden/chapter-25/APPARATUS.md'
      - 'manual-v2/golden/chapter-25/figures/**'
      - '.github/scripts/build_golden_ab_pedagogy.py'
      - '.github/workflows/golden-ab-pedagogy-preview.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core poppler-utils
          pip install markdown weasyprint

      - name: Build pedagogical apparatus preview
        run: |
          python .github/scripts/build_golden_ab_pedagogy.py
          weasyprint build/golden-pedagogy/preview.html build/golden-pedagogy/Manuale_V2_Prototipo_Apparato_Didattico_AB.pdf
          pdfinfo build/golden-pedagogy/Manuale_V2_Prototipo_Apparato_Didattico_AB.pdf | tee build/golden-pedagogy/pdfinfo.txt

      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: manual-v2-pedagogical-apparatus-preview
          path: |
            build/golden-pedagogy/Manuale_V2_Prototipo_Apparato_Didattico_AB.pdf
            build/golden-pedagogy/pdfinfo.txt
          retention-days: 7
