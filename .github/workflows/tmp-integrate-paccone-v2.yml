name: Temporary integrate Paccone v2

on:
  push:
    branches: [source-paccone-meraviglie]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: source-paccone-meraviglie

      - name: Apply canonical merges and registry
        run: |
          python3 - <<'PY'
          import base64, json
          from pathlib import Path

          def dec(s):
              return base64.b64decode(s).decode('utf-8')

          def append_once(path_str, marker, block_b64):
              path = Path(path_str)
              text = path.read_text()
              if marker not in text:
                  if not text.endswith('\n'):
                      text += '\n'
                  text += '\n' + dec(block_b64).strip() + '\n'
                  path.write_text(text)

          append_once('merenda/05_acquisizione/information-marketing.md', '## Paccone come sales letter fisica modulare', '')
          append_once('merenda/06_vendita/prequalifica-follow-up-decisori.md', '## Preparare più stakeholder con una base comune', '')
          append_once('merenda/09_business/retention-onboarding-e-customer-success.md', '## Il pacchetto post-acquisto come onboarding fisico', '')

          catalog_path = Path('sources/merenda-sources/catalog.json')
          rows = json.loads(catalog_path.read_text())
          ident = 'FM-SRC-0165'
          if not any(r.get('id') == ident for r in rows):
              rows.append({
                  'id': ident,
                  'type': 'course',
                  'title': 'Il Paccone delle Meraviglie',
                  'author_or_speaker': 'Frank Merenda',
                  'source_ref': 'https://my.metodomerenda.com/pacco-delle-meraviglie/',
                  'published_date': None,
                  'acquired_date': '2026-09-17',
                  'origin': 'official',
                  'status': 'STUDIATO',
                  'normalized_path': 'sources/merenda-sources/FM-SRC-0165/content.md',
                  'review_path': 'sources/merenda-sources/FM-SRC-0165/review.md',
                  'category': '05_acquisizione',
                  'weighted_novelty': 1,
                  'notes': 'Estende il paccone già canonico con architettura modulare, consumo guidato, follow-up attivato dalla consegna, personalizzazione per ruolo e applicazione post-acquisto.'
              })
          catalog_path.write_text(json.dumps(rows, ensure_ascii=False, indent=2) + '\n')

          status = Path('STATUS.md')
          text = status.read_text()
          text = text.replace('- Nuove fonti Merenda registrate: 164', '- Nuove fonti Merenda registrate: 165')
          text = text.replace('- Nuove fonti Merenda studiate: 164', '- Nuove fonti Merenda studiate: 165')
          old = '**CHATGPT — continuare l\'integrazione source-agnostic una fonte alla volta sui contenuti forniti dall\'utente. “Clientikit” è registrato come FM-SRC-0164, STUDIATO e mergiato nei nodi canonici target, gerarchia della domanda/consapevolezza e funnel.**'
          new = '**CHATGPT — continuare l\'integrazione source-agnostic una fonte alla volta sui contenuti forniti dall\'utente. “Il Paccone delle Meraviglie” è registrato come FM-SRC-0165, STUDIATO e mergiato nei nodi canonici information marketing, prequalifica/decisori e onboarding/retention.**'
          if old not in text:
              raise SystemExit('Next Action atteso non trovato in STATUS.md')
          status.write_text(text.replace(old, new))
          PY

      - name: Validate
        run: python3 scripts/validate_project.py

      - name: Commit integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add merenda/05_acquisizione/information-marketing.md \
                  merenda/06_vendita/prequalifica-follow-up-decisori.md \
                  merenda/09_business/retention-onboarding-e-customer-success.md \
                  sources/merenda-sources/catalog.json STATUS.md
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Integrate Paccone delle Meraviglie'
            git push origin HEAD:source-paccone-meraviglie
          fi
