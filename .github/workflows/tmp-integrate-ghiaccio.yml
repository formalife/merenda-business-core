name: Temporary integrate Ghiaccio

on:
  push:
    branches: [source-ghiaccio-eschimesi]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: source-ghiaccio-eschimesi

      - name: Update registry and status
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          catalog_path = Path('sources/merenda-sources/catalog.json')
          rows = json.loads(catalog_path.read_text())
          ident = 'FM-SRC-0166'
          if not any(r.get('id') == ident for r in rows):
              rows.append({
                  'id': ident,
                  'type': 'course',
                  'title': 'Ghiaccio agli Eschimesi',
                  'author_or_speaker': 'Frank Merenda',
                  'source_ref': 'https://my.metodomerenda.com/ghiaccio-agli-eschimesi/',
                  'published_date': None,
                  'acquired_date': '2026-09-17',
                  'origin': 'official',
                  'status': 'STUDIATO',
                  'normalized_path': 'sources/merenda-sources/FM-SRC-0166/content.md',
                  'review_path': 'sources/merenda-sources/FM-SRC-0166/review.md',
                  'category': '07_copy_comunicazione',
                  'weighted_novelty': 2,
                  'notes': 'Nuovo nodo canonico sul come scrivere: sales letter come progressione di convinzioni, headline, reason why, unique mechanism, prova, obiezioni, garanzia, prezzo, CTA ed editing.'
              })
          catalog_path.write_text(json.dumps(rows, ensure_ascii=False, indent=2) + '\n')

          status_path = Path('STATUS.md')
          text = status_path.read_text()
          text = text.replace('- Nuove fonti Merenda registrate: 165', '- Nuove fonti Merenda registrate: 166')
          text = text.replace('- Nuove fonti Merenda studiate: 165', '- Nuove fonti Merenda studiate: 166')
          old = '**CHATGPT — continuare l\'integrazione source-agnostic una fonte alla volta sui contenuti forniti dall\'utente. “Il Paccone delle Meraviglie” è registrato come FM-SRC-0165, STUDIATO e mergiato nei nodi canonici information marketing, prequalifica/decisori e onboarding/retention.**'
          new = '**CHATGPT — continuare l\'integrazione source-agnostic una fonte alla volta sui contenuti forniti dall\'utente. “Ghiaccio agli Eschimesi” è registrato come FM-SRC-0166, STUDIATO; ha creato il nuovo nodo canonico 07_copy_comunicazione/scrittura-sales-letter-e-argomentazione.md dedicato al come scrivere.**'
          if old not in text:
              raise SystemExit('Next Action atteso non trovato in STATUS.md')
          status_path.write_text(text.replace(old, new))
          PY

      - name: Validate
        run: python3 scripts/validate_project.py

      - name: Commit integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sources/merenda-sources/catalog.json STATUS.md
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Register Ghiaccio agli Eschimesi'
            git push origin HEAD:source-ghiaccio-eschimesi
          fi
